<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Link</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --warn-bg: #422006;
    --warn-text: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 480px; width: 100%; }
  .logo { font-size: 48px; text-align: center; margin-bottom: 12px; }
  h1 { font-size: 22px; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  #cards { min-height: 180px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .card .label { font-size: 15px; font-weight: 600; }
  .card .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card a {
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .card a:active { background: var(--accent-hover); }
  .updated { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
  .warn {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🎬</div>
    <h1>Website Link</h1>
    <p class="subtitle">လက်ရှိ အလုပ်လုပ်နေသော Link များ — Bookmark လုပ်ထားပါ</p>
    <div id="cards">
      <div class="warn">Loading...</div>
    </div>
    <p class="updated" id="updatedNote"></p>
  </div>

  <script>
    fetch('links.json?_=' + Date.now())
      .then(r => r.json())
      .then(data => {
        const order = ['main_channel', 'backup_channel', 'bot'];
        const cardsHtml = order.map(key => {
          const item = data[key];
          if (!item) return '';
          const actionWord = key === 'bot' ? 'စတင်ရန်' : 'ဝင်ရန်';
          return `
            <div class="card">
              <div>
                <div class="label">${item.label}</div>
                <div class="desc">${item.username}</div>
              </div>
              <a href="${item.url}" target="_blank">${actionWord}</a>
            </div>`;
        }).join('');
        document.getElementById('cards').innerHTML = cardsHtml;
        document.getElementById('updatedNote').textContent =
          `Main Channel/Bot ပိတ်ခံရရင်တောင် ဒီ Page ကို ပြန်ဖွင့်ရင် Backup Link အသစ်ကို အမြဲ တွေ့ရပါလိမ့်မယ်။ (Last updated: ${data.last_updated || '-'})`;
      })
      .catch(() => {
        document.getElementById('cards').innerHTML =
          '<div class="warn">⚠️ Link data ကို Load လုပ်၍ မရပါ — Internet Connection စစ်ပြီး ပြန်ဖွင့်ကြည့်ပါ။</div>';
      });
  </script>
</body>
</html>
